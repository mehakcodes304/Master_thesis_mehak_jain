# RNAnue params.cfg — human_rRNA

# --- Paths ---
trtms   = /mnt/ceph/mjain/software/envs/bio/rnanue_run/human_rRNA/trtms
outdir  = /mnt/ceph/mjain/software/envs/bio/rnanue_run/human_rRNA/output
dbref   = /mnt/ceph/mjain/software/envs/bio/rnanue_run/refs/human_rRNA_reference_for_igv.fa
features     = /mnt/ceph/mjain/software/envs/bio/rnanue_run/refs/human_rRNA_igv.gff3
featuretypes = rRNA

# --- General ---
loglevel      = info
threads       = 4
orientation   = both
maskmulticopy = false
chunksize     = 100000

# --- Preprocessing ---
preprocess  = true
deduplicate = false
mtrim       = 0.05
minovltrim  = 5
minqual     = 0
minlen      = 10
wqual       = 0
wtrim       = 0

# --- Alignment ---
multimap     = true
accuracy     = 90
minfragsco   = 5
minalignlen  = 5
minfraglen   = 4
minsplicecov = 40

# --- Post-alignment filtering ---
mapqmin      = 0
maxprim      = 5
cmplmin      = 0.0
sitelenratio = 0.2
mindetectlen = 4
nrgmax       = 0.0
exclclipping = false
includewobble = false
mincontr     = 0.0

# --- Clustering ---
maxselfoverlap = 1.0
clustmethod    = specific
clustfrac      = 0.9
padj           = 1.0
mincount = 3
