# =============================================================================
# RNAnue params.cfg — human rRNA chimeric read detection
# =============================================================================

# --- Paths ---
trtms   = /mnt/ceph/mjain/software/envs/bio/rnanue_run/human_rRNA_5_8S/trtms
outdir  = /mnt/ceph/mjain/software/envs/bio/rnanue_run/human_rRNA_5_8S/output
dbref   = /mnt/ceph/mjain/software/envs/bio/rnanue_run/refs/human_rRNA_5_8S_fixed6_reference_dna.fa


features = /mnt/ceph/mjain/software/envs/bio/rnanue_run/refs/human_rRNA_5_8S.gff3
featuretypes = rRNA

# --- General ---
loglevel      = info
threads       = 26
orientation   = same
maskmulticopy = false
chunksize     = 100000

# --- Preprocessing ---
preprocess  = true
deduplicate = false
mtrim       = 0.05
minovltrim  = 5 
minqual     = 0
minlen = 8
wqual       = 0
wtrim       = 0

# --- Alignment (segemehl) ---
multimap     = false
accuracy     = 90     
minfragsco   = 5      
minalignlen  = 5
minfraglen   = 4
minsplicecov = 40     

# --- Post-alignment filtering ---
mapqmin      = 0
maxprim      = 5
cmplmin      = 0.0
sitelenratio = 0.2
mindetectlen = 4
nrgmax       = 0.0
exclclipping = false
includewobble = false
mincontr     = 0.0

# --- Clustering ---
maxselfoverlap = 0.9
clustmethod    = specific
clustfrac      = 0.6
padj           = 1.0
mincount       = 3.0

